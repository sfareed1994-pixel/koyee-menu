<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Koyee Korean Cafe & Cuisine | Menu</title>

<meta
  name="description"
  content="Koyee Korean Cafe & Cuisine bilingual English and Arabic digital menu in Al Khobar, Saudi Arabia."
>

<style>

/* =========================================================
   COLORS / GLOBAL
========================================================= */

:root{
  --black:#171717;
  --red:#b51e2b;
  --cream:#f7f5f1;
  --gray:#6f6f6f;
  --border:#e7e3dd;
  --white:#ffffff;
  --shadow:0 15px 40px rgba(0,0,0,.09);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  color:var(--black);
  background:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

html[dir="rtl"] body{
  font-family:Tahoma,Arial,sans-serif;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  max-width:100%;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  position:sticky;
  top:0;
  z-index:1000;

  background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);

  border-bottom:1px solid var(--border);
}

.header-inner{
  max-width:1200px;
  min-height:78px;

  margin:auto;
  padding:10px 20px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo img{
  width:175px;
  display:block;
}


/* =========================================================
   LANGUAGE SWITCH
========================================================= */

.language{
  display:flex;
  gap:3px;

  padding:4px;

  border-radius:999px;
  background:#f1f0ed;
}

.language button{
  border:0;
  background:transparent;

  color:#666;
  font-weight:800;

  padding:10px 17px;
  border-radius:999px;
}

.language button.active{
  color:#fff;
  background:#171717;
}


/* =========================================================
   HERO
========================================================= */

.hero{
  min-height:420px;

  position:relative;
  overflow:hidden;

  display:flex;
  align-items:center;

  background:#fafafa;

  border-bottom:1px solid var(--border);
}

.hero-pattern{
  position:absolute;

  top:-90px;
  left:-80px;

  width:500px;

  opacity:.08;

  pointer-events:none;
}

html[dir="rtl"] .hero-pattern{
  left:auto;
  right:-80px;

  transform:scaleX(-1);
}

.hero-inner{
  position:relative;
  z-index:2;

  width:100%;
  max-width:1200px;

  margin:auto;
  padding:70px 20px;
}

.hero-label{
  margin-bottom:15px;

  color:var(--red);

  font-size:13px;
  font-weight:900;

  letter-spacing:1.5px;
  text-transform:uppercase;
}

.hero h1{
  max-width:760px;

  margin:0;

  font-size:clamp(48px,7vw,88px);
  line-height:.94;

  letter-spacing:-4px;
}

html[dir="rtl"] .hero h1{
  letter-spacing:0;
  line-height:1.2;
}

.hero p{
  max-width:620px;

  margin:24px 0 0;

  color:#666;

  font-size:16px;
  line-height:1.8;
}


/* =========================================================
   CATEGORY BAR
========================================================= */

.category-bar{
  position:sticky;
  top:78px;

  z-index:900;

  background:#fff;

  border-bottom:1px solid var(--border);
}

.category-shell{
  max-width:1260px;

  margin:auto;
  padding:10px 12px;

  display:grid;
  grid-template-columns:42px minmax(0,1fr) 42px;

  align-items:center;
  gap:7px;
}

.categories{
  min-width:0;

  display:flex;
  gap:8px;

  overflow-x:auto;
  overflow-y:hidden;

  scroll-behavior:smooth;
  scrollbar-width:none;

  padding:2px;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category-btn{
  flex:0 0 auto;

  border:1px solid var(--border);

  background:#fff;
  color:#333;

  border-radius:999px;

  padding:10px 16px;

  font-size:13px;
  font-weight:800;

  white-space:nowrap;
}

.category-btn:hover,
.category-btn.active{
  color:#fff;
  background:var(--red);
  border-color:var(--red);
}


/* CATEGORY SCROLL ARROWS */

.category-arrow{
  width:40px;
  height:40px;

  border:1px solid var(--border);
  border-radius:50%;

  background:white;
  color:#222;

  display:grid;
  place-items:center;

  font-size:25px;
  font-weight:bold;

  line-height:1;

  box-shadow:0 3px 10px rgba(0,0,0,.06);
}

.category-arrow:hover{
  color:white;
  background:var(--red);
  border-color:var(--red);
}


/* =========================================================
   MAIN CONTENT
========================================================= */

main{
  max-width:1200px;

  margin:auto;
  padding:42px 20px 90px;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:25px;

  margin-bottom:45px;
}

.toolbar-title{
  font-size:25px;
  font-weight:900;
}

.toolbar-subtitle{
  margin-top:5px;

  color:#777;

  font-size:13px;
}

.search{
  width:min(100%,380px);

  padding:14px 18px;

  border:1px solid var(--border);
  border-radius:999px;

  background:#fafafa;

  outline:none;
}

.search:focus{
  border-color:var(--red);

  box-shadow:
    0 0 0 3px rgba(181,30,43,.08);
}


/* =========================================================
   MENU SECTION
========================================================= */

.section{
  margin-bottom:72px;

  scroll-margin-top:165px;
}

.section-heading{
  margin-bottom:23px;

  display:flex;

  justify-content:space-between;
  align-items:flex-end;

  gap:20px;
}

.section-heading h2{
  margin:0;

  font-size:clamp(29px,4vw,42px);
}

.section-heading span{
  color:#888;

  font-size:13px;
}

.menu-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:20px;
}


/* =========================================================
   DISH CARDS
========================================================= */

.card{
  overflow:hidden;

  min-height:235px;

  display:grid;

  grid-template-columns:
    220px minmax(0,1fr);

  background:white;

  border:1px solid var(--border);
  border-radius:22px;

  transition:.2s ease;
}

.card:hover{
  transform:translateY(-3px);

  box-shadow:var(--shadow);
}

.card-image{
  min-height:235px;

  overflow:hidden;

  background:#f2f2f2;
}

.card-image img{
  width:100%;
  height:100%;

  min-height:235px;

  display:block;

  object-fit:cover;
}

.card-content{
  padding:21px;

  display:flex;
  flex-direction:column;
}

.card-top{
  display:flex;

  justify-content:space-between;
  align-items:flex-start;

  gap:14px;
}

.card h3{
  margin:0;

  font-size:18px;
  line-height:1.35;
}

.price{
  color:var(--red);

  font-size:14px;
  font-weight:900;

  line-height:1.45;

  text-align:end;

  white-space:pre-line;
}

.description{
  margin:12px 0 15px;

  color:#686868;

  font-size:13px;
  line-height:1.65;
}


/* =========================================================
   BBQ SET - SPECIAL FULL IMAGE FIX
========================================================= */

.featured-card{
  grid-column:1 / -1;

  grid-template-columns:
    minmax(420px,56%) minmax(280px,44%);

  min-height:360px;
}

.featured-card .card-image{
  min-height:360px;

  background:#eef1f3;

  display:flex;
  align-items:center;
  justify-content:center;
}

.featured-card .card-image img{
  width:100%;
  height:100%;

  min-height:360px;

  object-fit:contain;

  background:#eef1f3;
}

.featured-card .card-content{
  padding:32px;
  justify-content:center;
}

.featured-card h3{
  font-size:25px;
}


/* =========================================================
   CALORIES / NOTES / MENU INDICATORS
========================================================= */

.meta{
  margin-top:auto;

  display:flex;
  flex-wrap:wrap;

  align-items:center;

  gap:7px;
}

.badge{
  display:inline-block;

  padding:6px 9px;

  border-radius:999px;

  background:var(--cream);

  color:#555;

  font-size:11px;
  font-weight:800;
}

.badge.special{
  color:var(--red);

  background:#fff0f1;
}

.menu-indicators{
  width:auto;
  height:31px;

  max-width:175px;

  display:block;

  margin-top:6px;

  object-fit:contain;
  object-position:left center;
}

html[dir="rtl"] .menu-indicators{
  object-position:right center;
}


/* =========================================================
   INFORMATION SECTIONS
========================================================= */

.info{
  margin-top:55px;

  padding:38px;

  background:var(--cream);

  border-radius:28px;
}

.info h2{
  margin-top:0;

  font-size:31px;
}

.info p{
  color:#5e5e5e;

  line-height:1.85;
}

.info-with-photo{
  display:grid;

  grid-template-columns:
    1fr 340px;

  gap:35px;

  align-items:center;
}

.info-photo{
  width:100%;
  height:260px;

  object-fit:cover;

  border-radius:20px;
}


/* =========================================================
   SERVICE PROMISE
========================================================= */

.promise-grid{
  margin-top:22px;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:14px;
}

.promise{
  padding:20px;

  background:#fff;

  border:1px solid var(--border);
  border-radius:18px;

  line-height:1.65;
}

.promise strong{
  display:block;

  margin-bottom:10px;
}

.promise span{
  color:#636363;

  font-size:13px;
}


/* =========================================================
   ORIGINAL FOOD ALLERGEN GUIDE
========================================================= */

.allergen-guide{
  background:white;

  border:1px solid var(--border);
  border-radius:22px;

  padding:18px;

  margin-top:22px;
}

.allergen-guide img{
  display:block;

  width:100%;
  max-width:950px;

  height:auto;

  margin:auto;

  object-fit:contain;

  background:white;

  border-radius:14px;
}

.allergen-guide-note{
  text-align:center;

  color:#777;

  font-size:12px;

  margin-top:13px;
}


/* FALLBACK IF SCREENSHOT FILE IS MISSING */

.allergen-fallback{
  display:none;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:10px;

  margin-top:20px;
}

.allergen-fallback div{
  padding:13px;

  background:white;

  border:1px solid var(--border);
  border-radius:14px;

  font-size:13px;
}


/* =========================================================
   FOOTER
========================================================= */

footer{
  padding:55px 20px;

  color:#fff;

  background:#151515;
}

.footer-inner{
  max-width:1200px;

  margin:auto;

  display:flex;

  justify-content:space-between;
  align-items:flex-end;

  gap:35px;
}

.footer-logo{
  width:180px;

  display:block;

  filter:brightness(0) invert(1);
}

.footer-tag{
  margin-top:14px;
}

.footer-text{
  color:#bbb;

  font-size:14px;
  line-height:1.8;
}

.footer-text a{
  color:#fff;

  text-decoration:none;
}


/* =========================================================
   EMPTY SEARCH
========================================================= */

.empty{
  padding:60px 20px;

  color:#888;

  text-align:center;

  border:1px dashed var(--border);
  border-radius:20px;
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:950px){

  .menu-grid{
    grid-template-columns:1fr;
  }

  .featured-card{
    grid-template-columns:
      minmax(350px,52%) minmax(0,48%);
  }

  .promise-grid{
    grid-template-columns:1fr;
  }

  .info-with-photo{
    grid-template-columns:1fr;
  }

  .info-photo{
    height:300px;
  }

  .allergen-fallback{
    grid-template-columns:
      repeat(2,1fr);
  }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:640px){

  .header-inner{
    min-height:68px;
  }

  .logo img{
    width:125px;
  }

  .language button{
    padding:8px 11px;

    font-size:12px;
  }

  .category-bar{
    top:68px;
  }

  .category-shell{
    grid-template-columns:minmax(0,1fr);

    padding:10px 12px;
  }

  .category-arrow{
    display:none;
  }

  .hero{
    min-height:345px;
  }

  .hero h1{
    letter-spacing:-2px;
  }

  .toolbar{
    flex-direction:column;

    align-items:stretch;
  }

  .search{
    width:100%;
  }

  .card,
  .featured-card{
    display:block;
  }

  .card-image{
    height:245px;
  }

  .card-image img{
    height:245px;
    min-height:245px;
  }

  .featured-card .card-image{
    height:auto;
    min-height:0;

    padding:0;
  }

  .featured-card .card-image img{
    width:100%;
    height:auto;

    min-height:0;

    object-fit:contain;
  }

  .featured-card .card-content{
    padding:21px;
  }

  .featured-card h3{
    font-size:20px;
  }

  .info{
    padding:25px 18px;
  }

  .allergen-fallback{
    grid-template-columns:1fr;
  }

  .footer-inner{
    flex-direction:column;

    align-items:flex-start;
  }

}

</style>

</head>

</nav>



<!-- ======================================================
     MAIN

      <p data-text="healthText"></p>

    </div>


    <img

      alt="Kimchi"

  </section>



  <!-- ==================================================

      </div>


      <div class="promise">

        <strong data-text="promise3Title"></strong>

        <span data-text="promise3Text"></span>

      </div>


    </div>

  </section>



  <!-- ==================================================
       ORIGINAL MENU ALLERGEN GUIDE
  ================================================== -->

  <section class="info">

    <h2 data-text="allergenTitle"></h2>

    <p data-text="allergenText"></p>


    <div class="allergen-guide">

      <img
        id="allergenGuideImage"
        src="images/allergens-en.png"
        alt="Koyee Food Allergen Guide"
        onerror="showAllergenFallback()"
      >


      <div
        class="allergen-guide-note"
        data-text="allergenGuideNote"
      ></div>


      <div
        id="allergenFallback"
        class="allergen-fallback"
      ></div>

    </div>

  </section>


</main>



<!-- ======================================================
     FOOTER
====================================================== -->

<footer>

  <div class="footer-inner">


    <div>

      <img
        class="footer-logo"
        src="images/image1.jpeg"
        alt="Koyee"
      >


      <div
        class="footer-tag"
        data-text="footerSlogan"
      ></div>

    </div>



    <div class="footer-text">

      <div data-text="address"></div>


      <div>

        <a href="tel:+966138337888">
          +966 13 833 7888
        </a>

      </div>

    </div>


  </div>

</footer>

  "الرخويات ومنتجاتها",
  "ثاني أكسيد الكبريت / السلفيت",
  "الترمس ومنتجاته",
  "الكرفس ومنتجاته",
  "الصويا ومنتجاتها"
]

};



/* =========================================================
   STATE
========================================================= */

let language = "en";

let selectedCategory = "all";



/* =========================================================
   LANGUAGE
========================================================= */

function setLanguage(lang){

  language = lang;


  document.documentElement.lang =
    lang;


  document.documentElement.dir =
    lang === "ar"
      ? "rtl"
      : "ltr";


  document
    .getElementById("enBtn")
    .classList.toggle(
      "active",
      lang === "en"
    );


  document
    .getElementById("arBtn")
    .classList.toggle(
      "active",
      lang === "ar"
    );


  document
    .querySelectorAll("[data-text]")
    .forEach(element=>{

      const key =
        element.dataset.text;


      if(text[lang][key]){

        element.textContent =
          text[lang][key];

      }

    });


  document.getElementById("search").placeholder =
    text[lang].search;


  updateAllergenGuide();

  renderCategories();

  renderMenu();

  renderAllergenFallback();

}



/* =========================================================
   CATEGORY BAR
========================================================= */

function renderCategories(){

  const container =
    document.getElementById("categories");


  let html = `

    <button

      class="
        category-btn
        ${selectedCategory==="all" ? "active" : ""}
      "

      onclick="selectCategory('all')"

    >

      ${text[language].all}

    </button>

  `;


  categoryData.forEach(category=>{

    html += `

      <button

        class="
          category-btn
          ${selectedCategory===category.id ? "active" : ""}
        "

        onclick="
          selectCategory('${category.id}')
        "

      >

        ${category[language]}

      </button>

    `;

  });


  container.innerHTML =
    html;

}



/* =========================================================
   CATEGORY ARROW SCROLL
========================================================= */

function scrollCategories(direction){

  const container =
    document.getElementById("categories");


  container.scrollBy({

    left:
      direction * 360,

    behavior:
      "smooth"

  });

}



/* =========================================================
   CATEGORY SELECTION
========================================================= */

function selectCategory(id){

  selectedCategory =
    id;


  renderCategories();

  renderMenu();


  const main =
    document.querySelector("main");


  window.scrollTo({

    top:
      main.offsetTop - 140,

    behavior:
      "smooth"

  });

}



/* =========================================================
   SAFE TEXT
========================================================= */

function safe(value){

  if(!value){

    return "";

  }


  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;");

}



/* =========================================================
   RENDER MENU
========================================================= */

function renderMenu(){

  const container =
    document.getElementById("menu");


  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const visibleCategories =

    selectedCategory === "all"

      ? categoryData

      : categoryData.filter(
          category =>
            category.id === selectedCategory
        );


  let html = "";

  let total = 0;



  visibleCategories.forEach(category=>{


    const dishes =

      menuData.filter(item=>{


        if(
          item.category !== category.id
        ){

          return false;

        }


        const searchable = [

          item.name?.[language],

          item.description?.[language],

          item.note?.[language],

          item.price,

          item.calories

        ]

        .filter(Boolean)

        .join(" ")

        .toLowerCase();


        return (

          !search ||

          searchable.includes(search)

        );

      });



    if(!dishes.length){

      return;

    }



    total +=
      dishes.length;



    html += `

      <section
        class="section"
        id="${category.id}"
      >


        <div class="section-heading">


          <h2>
            ${category[language]}
          </h2>


          <span>

            ${dishes.length}

            ${text[language].items}

          </span>


        </div>



        <div class="menu-grid">

    `;



    dishes.forEach(item=>{


      const featuredClass =

        item.category === "bbq-set"

          ? "featured-card"

          : "";


      html += `

        <article
          class="card ${featuredClass}"
        >


          <div class="card-image">


            <img

              src="${item.image}"

              alt="${safe(
                item.name[language]
              )}"

              loading="lazy"

            >


          </div>



          <div class="card-content">


            <div class="card-top">


              <h3>

                ${safe(
                  item.name[language]
                )}

              </h3>


              <div class="price">

                ${safe(
                  item.price || ""
                )}

              </div>


            </div>



            ${
              item.description?.[language]

              ?

              `

              <p class="description">

                ${safe(
                  item.description[language]
                )}

              </p>

              `

              :

              ""
            }



            <div class="meta">


              ${
                item.calories

                ?

                `

                <span class="badge">

                  ${safe(
                    item.calories
                  )}

                </span>

                `

                :

                ""
              }



              ${
                item.note?.[language]

                ?

                `

                <span class="badge special">

                  ${safe(
                    item.note[language]
                  )}

                </span>

                `

                :

                ""
              }



              ${
                item.indicator

                ?

                `

                <img

                  class="menu-indicators"

                  src="${item.indicator}"

                  alt="${
                    language === "en"

                      ? "Food allergen and menu indicators"

                      : "رموز مسببات الحساسية ومؤشرات الطبق"
                  }"

                  loading="lazy"

                >

                `

                :

                ""
              }


            </div>


          </div>


        </article>

      `;

    });



    html += `

        </div>

      </section>

    `;

  });



  if(!total){

    html = `

      <div class="empty">

        ${
          language === "en"

            ? "No dishes found."

            : "لم يتم العثور على أطباق."
        }

      </div>

    `;

  }



  container.innerHTML =
    html;

}



/* =========================================================
   ALLERGEN GUIDE IMAGE
========================================================= */

function updateAllergenGuide(){

  const image =
    document.getElementById(
      "allergenGuideImage"
    );


  const fallback =
    document.getElementById(
      "allergenFallback"
    );


  image.style.display =
    "block";


  fallback.style.display =
    "none";


  image.src =

    language === "en"

      ? "images/allergens-en.png"

      : "images/allergens-ar.png";


  image.alt =

    language === "en"

      ? "Koyee Food Allergens Guide"

      : "دليل مسببات الحساسية من كويي";

}



/* =========================================================
   IF ALLERGEN SCREENSHOT IS MISSING
========================================================= */

function showAllergenFallback(){

  document
    .getElementById(
      "allergenGuideImage"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "allergenFallback"
    )
    .style.display =
      "grid";

}



/* =========================================================
   FALLBACK ALLERGEN TEXT
========================================================= */

function renderAllergenFallback(){

  const container =
    document.getElementById(
      "allergenFallback"
    );


  container.innerHTML =

    allergenData[language]

      .map(item=>`

        <div>
          ${safe(item)}
        </div>

      `)

      .join("");

}



/* =========================================================
   MOUSE-WHEEL CATEGORY SCROLL
========================================================= */

const categoryContainer =
  document.getElementById("categories");


categoryContainer.addEventListener(

  "wheel",

  function(event){


    if(
      Math.abs(event.deltaY) >
      Math.abs(event.deltaX)
    ){

      event.preventDefault();


      const directionFactor =

        document.documentElement.dir === "rtl"

          ? -1

          : 1;


      categoryContainer.scrollLeft +=

        event.deltaY *
        directionFactor;

    }

  },

  {
    passive:false
  }

);



/* =========================================================
   START WEBSITE

   Using setLanguage() on first load also fixes the
   Service Promise descriptions that were previously blank.
========================================================= */

setLanguage("en");


</script>


</body>
